name: CI

# main へのPRと、main への push（マージ）のたびに動かす
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じブランチに続けてpushしたら、古い実行は止めて新しい方だけ動かす（無駄な待ち時間を減らす）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # テストは本物の Redis を使う（二重発行を防げているかを、Redis 本体の動きで確かめるため）
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        # Redis が起動しきる前にテストが始まらないよう、PING が通るまで待つ
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm install ではなく npm ci: package-lock.json の通りに入れるので、手元とCIで同じバージョンになる
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      # lint・型・テストが通っても、ビルドで落ちることがある（Server/Client Componentの使い分けなど）ので確認する
      - name: ビルド
        run: npm run build
