<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ガチャたこ焼き ガラポンの回し方</title>
    <!--
      外部ファイル（フォント・CDN）は読み込まない。
      Why: 屋台のネットが不安定でも、このフォルダだけで表示できるようにするため。
    -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <!--
        白いコンテナに中身をまとめ、外側だけを赤にする。
        Why: 全面が赤だと派手すぎて読みにくいため。赤は外枠として残し、店のイメージカラーは保つ。
      -->
      <div class="container">
        <h1 class="title">ゆりかごみたいに ゆらゆら回してね</h1>

        <div class="stage">
          <!-- 左: タコの赤ちゃんのゆりかご（見立て） -->
          <figure class="scene">
            <div class="cradle-box">
              <img class="cradle" src="images/cradle.png" alt="ゆりかごで眠るタコの赤ちゃん" />
              <!--
                タコの頭の右上から「Z z z」が浮かんで消える。寝ていることを伝えるため。
                Why: ゆりかごと一緒に傾くと読みにくいので、ゆりかごの画像の外（揺れない枠）に置く。
              -->
              <span class="zzz" aria-hidden="true">
                <span class="zzz-letter">Z</span>
                <span class="zzz-letter">z</span>
                <span class="zzz-letter">z</span>
              </span>
            </div>
            <figcaption class="caption">タコの赤ちゃんを ゆらすように…</figcaption>
          </figure>

          <p class="equals" aria-hidden="true">＝</p>

          <!-- 右: ガラポン本体と、往復する取っ手 -->
          <figure class="scene">
            <div class="garapon">
              <!--
                ドラムと土台は別の画像。どちらも同じ大きさ・同じ座標でそろえてあるので、重ねるだけで元の絵になる。
                重なり順（奥 → 手前）: ドラム → 土台 → 出てくる玉・取っ手
                Why: ドラムは取っ手と一緒に回り、土台は動かない。土台をドラムより手前にすると、
                     回ったドラムの角が柱や台の前にはみ出して見えることがない。
                     取っ手は柱の軸に付いているので、土台よりさらに手前に置く。
              -->
              <img class="garapon-drum" src="images/drum.png" alt="" />
              <img class="garapon-stand" src="images/stand.png" alt="ガラポン" />

              <!--
                取っ手が下の端に来るたびに、ドラムの下から玉が1つ出て受け皿に落ちる。
                黒 → 青 → 赤 の順に、1往復ごとに1色ずつ出す（動きは CSS の delay でずらしている）。
              -->
              <span class="drop-ball ball-black" aria-hidden="true"></span>
              <span class="drop-ball ball-blue" aria-hidden="true"></span>
              <span class="drop-ball ball-red" aria-hidden="true"></span>

              <!--
                取っ手が動く範囲を、円をえがく両向きの矢印で表す。
                Why: まっすぐな ⇔ では「どこからどこまで動かすか」が伝わりにくい。
                     取っ手と同じ円の上に矢印を引けば、動かす幅と向きがそのまま分かる。

                座標は .garapon の大きさを 100 とした値（viewBox="0 0 100 100"）。
                  - 円の中心: 軸の位置（62.53, 46.3）
                  - 半径: 56（取っ手の画像の先の端は軸から約 51。それより少し外側に引いて、取っ手から離す）
                  - 始まり: 取っ手の上の端（-10°）→ (117.68, 36.58)
                  - 終わり: 取っ手の下の端（90°）  → (62.53, 102.30)
                  - A 56 56 0 0 1 … 半径56の円で、時計回りに、短いほうの弧を通る
                角度を変えたときは、この2点も計算し直す（x = 62.53 + 56 × cos角度、y = 46.3 + 56 × sin角度）。
              -->
              <svg class="swing-arc" viewBox="0 0 100 100" aria-hidden="true">
                <defs>
                  <!-- 矢印の先。orient="auto-start-reverse" で、始まり側は逆向きにして両向きにする -->
                  <marker
                    id="swing-arrow-head"
                    viewBox="0 0 10 10"
                    refX="5"
                    refY="5"
                    markerWidth="3.2"
                    markerHeight="3.2"
                    orient="auto-start-reverse"
                  >
                    <path d="M0 0 L10 5 L0 10 Z" />
                  </marker>
                </defs>
                <path
                  d="M117.68 36.58 A56 56 0 0 1 62.53 102.30"
                  marker-start="url(#swing-arrow-head)"
                  marker-end="url(#swing-arrow-head)"
                />
              </svg>

              <!--
                handle-arm は「軸の位置にある大きさ0の点」。この点を回転させる。
                Why: 回転の中心を軸に固定しておけば、取っ手の画像を差し替えても
                     画像内の軸穴の位置（CSS変数）を直すだけで済む。
              -->
              <div class="handle-arm">
                <img class="handle" src="images/handle.png" alt="" />
              </div>
            </div>
            <!-- 円の矢印の先がガラポンの枠の下にはみ出すので、文字と重ならないよう少し下げる -->
            <figcaption class="caption caption-garapon">
              取っ手を
              <svg class="arrow-icon" viewBox="0 0 120 60" aria-hidden="true">
                <path d="M30 22 H90 M30 38 H90 M42 8 L12 30 L42 52 M78 8 L108 30 L78 52" />
              </svg>
              ゆらゆら往復
            </figcaption>
          </figure>
        </div>

        <p class="lead">
          1周回さずに、取っ手を行ったり来たりさせると 玉が出てくるよ
          <!--
            Why: 玉の入り方によっては往復だけで出ないこともあるので、そのときの手を書いておく。
                 店員が毎回説明しなくても、お客さんが自分で試せるようにするため。
          -->
          <span class="note">※ 出てこないときは、1周回してみてね！</span>
        </p>

        <!-- 出た玉の色と特典 -->
        <ul class="prizes" aria-label="玉の色と特典">
          <li class="prize">
            <span class="ball ball-red" aria-hidden="true"></span>
            <span>赤 … たこ焼き <strong class="accent">＋2個</strong></span>
          </li>
          <li class="prize">
            <span class="ball ball-blue" aria-hidden="true"></span>
            <span>青 … たこ焼き <strong class="accent">＋1個</strong></span>
          </li>
          <li class="prize">
            <span class="ball ball-black" aria-hidden="true"></span>
            <span>黒 … はずれ</span>
          </li>
        </ul>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
